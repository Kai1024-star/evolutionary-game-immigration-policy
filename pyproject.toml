[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolutionary-game-immigration-policy"
version = "1.0.0"
description = "English mathematical exposition and reproducible simulations of a government-firm-talent evolutionary game"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["immigration_game"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
